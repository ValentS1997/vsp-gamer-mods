Protection Key = E + LeftAlt

## Show the name and health bar of a recovering tame when you look at it. The game hides sleeping creatures from the crosshair, so with this off a recovering tame shows no name or health bar and the Protection Key can't reach it. [Not Synced with Server]
# Setting type: Boolean
# Default value: true
Show Recovering Tames = true

