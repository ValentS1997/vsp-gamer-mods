Crowd Range = 10

## Percent chance a newborn is one star above the tame giving birth, up to 2 stars. Eggs are not affected. [Synced with Server]
# Setting type: Int32
# Default value: 25
# Acceptable value range: From 0 to 100
Offspring Star Chance = 25

[5 - Commands]

## Press E on any tame to make it follow you or stay, not only on wolves, lox and the others the game allows. Off leaves each creature as the game or its mod made it. [Synced with Server]
# Setting type: Boolean
# Default value: true
Command Any Tame = true

## Every tame in range that is not following anyone starts following you. [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: F + LeftAlt
Follow All Key = F + LeftAlt

## Every tame in range that is following you stays where it is. [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: G + LeftAlt
Stay All Key = G + LeftAlt

## How far, in meters, the Follow All and Stay All keys reach. [Synced with Server]
# Setting type: Single
# Default value: 30
# Acceptable value range: From 5 to 100
Follow/Stay All Range = 30

[6 - Teleport]

## A tame that is following you teleports to you if it falls too far behind, and after you die and respawn. Vanilla following has no distance limit, so a tame stuck on terrain or left behind at your death is otherwise stuck or lost for good. [Synced with Server]
# Setting type: Boolean
# Default value: true
Teleport Lost Tames = true

## How far, in meters, a following tame can fall behind before it teleports to you. [Synced with Server]
# Setting type: Single
# Default value: 30
# Acceptable value range: From 20 to 50
Teleport Distance = 30

## Every tame following you teleports to you right away. [Not Synced with Server]
# Setting type: KeyboardShortcut
# Default value: H + LeftAlt
Teleport Tames Key = H + LeftAlt

## Following tames come with you into dungeons and back out. Turn off to leave big tames, like lox, outside, since they get stuck in narrow corridors. [Synced with Server]
# Setting type: Boolean
# Default value: false
Big Tames Enter Dungeons = false

## Tames following you near a portal come through it with you. The game normally leaves them behind. [Synced with Server]
# Setting type: Boolean
# Default value: true
Tames Follow Through Portals = true

