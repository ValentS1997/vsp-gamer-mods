## A tame has a chance to gain a star whenever it kills an enemy, up to 2 stars. The chance is higher the more stars the enemy has over the tame; killing something the same star or lower gives no bonus. [Synced with Server]
# Setting type: Boolean
# Default value: true
Gain Stars From Kills = true

## Base percent chance to gain a star on a kill. [Synced with Server]
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 0 to 100
Star Chance = 10

## Percent added per star the killed enemy has over the tame. [Synced with Server]
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 0 to 100
Bonus Chance Per Star = 5

## A tame that gains a star from a kill is healed to full. [Synced with Server]
# Setting type: Boolean
# Default value: true
Heal On New Star = true

[8 - Health]

## Seconds a tame takes to heal from empty to full. Lower is faster. Regeneration pauses while a tame is hungry, the same as the game's own creatures. [Synced with Server]
# Setting type: Int32
# Default value: 3600
# Acceptable value range: From 60 to 7200
Full Heal Time = 3600

## A tame that would die lies down to recover instead. Enemies leave it alone while it is down. A butcher knife still kills it. Individual tames can be switched with the Protection Key. [Synced with Server]
# Setting type: Boolean
# Default value: true
Protect All Tames = true

## Seconds a recovering tame rests, healing back to full, before it gets up. [Synced with Server]
# Setting type: Int32
# Default value: 60
