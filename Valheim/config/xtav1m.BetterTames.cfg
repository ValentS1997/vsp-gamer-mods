## Settings file was created by plugin BetterTames v0.9.0
## Plugin GUID: xtav1m.BetterTames

[1 - General]

## If enabled, the configuration is locked and can be changed by server admins only. [Synced with Server]
# Setting type: Boolean
# Default value: true
Lock Configuration = true

## A tame fights wild creatures of its own kind that are in a fight, like a tamed wolf defending you from wild wolves. Calm ones, and ones you are partway through taming, are left alone. The game normally keeps them on the same side. [Synced with Server]
# Setting type: Boolean
# Default value: true
Tames Fight Their Own Kind = true

[2 - Timers]

## Show how long a creature you are taming has left, counting any taming boost from players nearby. The timer is marked paused while the creature is hungry or frightened, since taming stops then. [Not Synced with Server]
# Setting type: Boolean
# Default value: true
Show Taming Timer = true

## Show how long a pregnant tame has left before giving birth. A tame that is not pregnant shows its love points instead: it gains one now and then while fed, calm and next to a partner, and gets pregnant when they are full. [Not Synced with Server]
# Setting type: Boolean
# Default value: true
Show Breeding Timer = true

## Show how long offspring have left before growing up. [Not Synced with Server]
# Setting type: Boolean
# Default value: true
Show Growth Timer = true

[3 - Taming]

## Minutes of feeding it takes to tame any creature. [Synced with Server]
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 1 to 180
Taming Time = 30

[4 - Breeding]

## Love points a tame needs before it gets pregnant. It gains one now and then while fed, calm and next to a partner. [Synced with Server]
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 1 to 20
Love Points Needed = 3

## Minutes offspring take to grow up. [Synced with Server]
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 1 to 180
Growth Time = 30

## How many creatures of the same kind can be nearby before breeding stops. [Synced with Server]
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 1 to 20
Crowd Limit = 6

## How far, in meters, Crowd Limit counts around a breeding pair. [Synced with Server]
# Setting type: Single
