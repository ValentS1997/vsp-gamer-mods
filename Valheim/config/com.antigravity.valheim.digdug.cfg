## Settings file was created by plugin DigDug v1.0.8
## Plugin GUID: com.antigravity.valheim.digdug

[General]

## If true, performing a batch dig/build will consume player stamina.
# Setting type: Boolean
# Default value: true
EnableStaminaDrain = true

## If true, pickaxes will not lose durability when batch digging.
# Setting type: Boolean
# Default value: false
IgnoreDurabilityLoss = false

## If true, raising terrain will not consume stones from your inventory.
# Setting type: Boolean
# Default value: false
IgnoreStoneRequirement = false

## Multiplier for the amount of stones required to raise terrain.
# Setting type: Single
# Default value: 1
StoneCostMultiplier = 1

## The maximum height/depth change limit in meters from the original base height. Vanilla Valheim is 8.0m. Increase this if you use mods that extend terrain height limits.
# Setting type: Single
# Default value: 8
MaxTerrainOffset = 8

[Keybinds]

## Key to rotate player/preview counter-clockwise.
# Setting type: KeyboardShortcut
# Default value: LeftArrow
RotateLeftKey = LeftArrow

## Key to rotate player/preview clockwise.
# Setting type: KeyboardShortcut
# Default value: RightArrow
RotateRightKey = RightArrow

## Key or mouse button to open the DigDug menu while holding a pickaxe. Defaults to Right Mouse Button (Mouse1). If reassigned to another key (e.g. G), Right Mouse Button will retain its native pickaxe blocking and dodge roll actions.
# Setting type: KeyboardShortcut
# Default value: Mouse1
MenuHotkey = LeftAlt

[UI]

