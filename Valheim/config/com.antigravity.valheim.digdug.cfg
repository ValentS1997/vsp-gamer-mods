# Setting type: Single
# Default value: -1
WindowPositionX = -1

## Legacy screen Y coordinate for the DigDug window.
# Setting type: Single
# Default value: -1
WindowPositionY = -1

## Horizontal pixel offset from screen center for the DigDug window.
# Setting type: Single
