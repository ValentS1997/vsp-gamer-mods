## Settings file was created by plugin SmartRepair v1.0.1
## Plugin GUID: com.ljindustries.valheim.smartrepair

[Advanced]

## Log a line per repaired item to the BepInEx console.
# Setting type: Boolean
# Default value: false
VerboseLogging = false

[Auto Repair]

## Repair everything the station can handle the moment you start using it.
# Setting type: Boolean
# Default value: true
Enabled = true

## Show a centre-screen message saying how many items were repaired.
# Setting type: Boolean
# Default value: true
ShowMessage = true

## Text for that message. {0} is the number of items repaired.
# Setting type: String
# Default value: Repaired {0} item(s)
MessageText = Repaired {0} item(s)

[Cross-Station Repair]

## Let a station repair anything an earlier station in the progression could repair. A Black Forge then covers Forge and Workbench gear as well as its own. This also applies to the manual repair button, not just the automatic pass.
# Setting type: Boolean
# Default value: true
Enabled = true

## Crafting stations in progression order, earliest first, comma separated. These are the station's internal names (the localisation token, with or without the $). Stations left off this list keep vanilla behaviour, so add modded stations here to slot them into the progression.
# Setting type: String
# Default value: $piece_workbench, $piece_forge, $piece_artisanstation, $piece_blackforge, $piece_magetable
StationOrder = $piece_workbench, $piece_forge, $piece_artisanstation, $piece_blackforge, $piece_magetable

## Also require the station's upgrade level to meet the recipe's minimum when repairing gear from an earlier station. Off by default: station levels are not comparable across station types, so a level 1 Black Forge is further along than a level 4 Workbench.
# Setting type: Boolean
# Default value: false
RequireStationLevel = false

