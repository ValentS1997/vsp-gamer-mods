[01 - General]

## How much FGN writes to the BepInEx log. Message is normal; Info adds detail for troubleshooting; Debug also adds the timed reports (traffic, server timings, ownership counts).
# Setting type: LogLevel
# Default value: Message
# Acceptable values: Warning, Message, Info, Debug
Log Level = Message

## Adds AI LOD throttling stats to the server's periodic [ServerStatus] log line. Turn off for a shorter log.
# Setting type: Boolean
# Default value: true
Show AILOD in ServerStatus = true

## Seconds between [ServerStatus] health lines in a dedicated server's log (written while Server-Side Simulation
## is on). Lower = more detail, more log.
# Setting type: Single
# Default value: 60
# Acceptable value range: From 10 to 3600
Diagnostic Rollup Interval (sec) = 60

## Diagnostic for crashes during cape cloth setup: logs each step before it runs, so the last line before a crash
## names it. Very verbose; leave off for normal play. Client only; requires a restart.
# Setting type: Boolean
# Default value: false
Enable Cape Crash Diagnostics = false

## Diagnostic for items and tombstones sinking through floors: logs dropped items at risk or falling, and build
## pieces that load too late to hold them. Only observes, but costs performance; leave off for normal play.
## Requires a restart.
# Setting type: Boolean
# Default value: false
Enable Fall-Through Diagnostics = false

[02 - Client Performance]

## Multiplies how many objects the game creates per frame while an area loads in (1 = vanilla).
## Higher loads areas faster but with bigger hitches. Used when 'Enable Time-Slice Instantiation' is off
## or behind the loading screen; Client Auto-Tune replaces it with its own value. Client only.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 8
Zone Load Batch Size = 1

## Steam receive buffer size in bytes, used when Auto-Tune is off. A bigger buffer rides out short stalls without
## losing data, at the cost of memory. Values below 2 MB (including the default) are raised to 2 MB.
# Setting type: Int32
# Default value: 262144
# Acceptable value range: From 65536 to 4194304
ZPackage Receive Buffer Bytes = 262144

## Creates incoming objects within a time budget per frame instead of vanilla's fixed count, so walking into a busy
## area spreads the work over several frames instead of one big hitch. Off = 'Zone Load Batch Size' is used.
## Client only; the loading screen still uses vanilla.
# Setting type: Boolean
# Default value: false
Enable Time-Slice Instantiation = false

## Milliseconds per frame spent creating objects when 'Enable Time-Slice Instantiation' is on. Lower = smoother
## frames while an area loads in; higher = it loads faster. Client Auto-Tune replaces it with its own value.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 1 to 16
Instantiation Budget Ms = 3

## Most objects created in one frame under time-slicing, however much of the budget is left.
## Client Auto-Tune replaces it with its own value.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 10 to 500
Max Instances Per Frame = 100

## Under time-slicing, triples the per-frame budget (up to 16 ms) while more than 'Safety Fallback Threshold'
## objects are waiting, such as after teleporting into a large base. Client Auto-Tune replaces it with its own value.
# Setting type: Boolean
# Default value: true
Safety Fallback Enabled = true

## Number of objects waiting to be created at which 'Safety Fallback Enabled' widens the budget.
## Client Auto-Tune replaces it with its own value.
# Setting type: Int32
# Default value: 5000
# Acceptable value range: From 100 to 50000
Safety Fallback Threshold = 5000

## Most objects removed per frame when you leave an area. Vanilla removes them all in one frame, which can freeze
## the game for seconds after leaving a big base; this spreads it out. 0 = vanilla. Client only.
# Setting type: Int32
# Default value: 200
# Acceptable value range: From 0 to 5000
Max Destroys Per Frame = 200

