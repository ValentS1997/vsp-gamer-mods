# Setting type: Boolean
# Default value: true
Send Remote Motion Timestamps = true

## Remote Motion: how far behind their newest update other players are drawn. Lower is snappier but overshoots more. Client only.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 0 to 200
Remote Motion Delay (ms) = 20

## Remote Motion: how long a player keeps moving along their last velocity when their next update is late. Client only.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 0 to 500
Remote Motion Extrapolation Cap (ms) = 100

## Remote Motion: how long a correction from a new update takes to blend in (0 = snap straight to it). Client only.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 0 to 500
Remote Motion Blend (ms) = 100

## Draws other players' arrows where they really are in flight, not a few metres behind. Needs Remote Motion on and
