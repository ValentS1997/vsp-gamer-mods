Remote Arrows = true

[04 - Networking]

## Compresses network traffic (recommended). It is agreed per connection, so it is only used with players and
## servers that also run FGN with compression on. Install on both server and clients.
# Setting type: Boolean
# Default value: true
Enable Compression = true

## How often world updates are sent; 100% (20/s) is vanilla. Lower helps a slow upload, higher looks smoother if
## bandwidth allows. While Auto-Tune is on it writes this value and your edits are replaced.
# Setting type: UpdateRateOptions
# Default value: _100
# Acceptable values: _150, _100, _75, _50
ZDO Send Rate = _100

## Keeps your live send rate (between Send Rate Min and Max) under what your connection actually delivers, so a
## busy line backs off instead of flooding. Off = Steam's own rate control. Steam connections only, not crossplay.
# Setting type: Boolean
# Default value: true
Adaptive Upload = true

## Largest batch of world updates sent to one player at a time, and each player's starting send window (the fixed
## limit when 'Adaptive Send Window' is off). Crossplay players use 'Crossplay In-Flight KB' instead.
## While Auto-Tune is on it writes this value and your edits are replaced.
# Setting type: QueueSizeOptions
# Default value: _32KB
# Acceptable values: _80KB, _64KB, _48KB, _32KB, _vanilla
Queue Size = _32KB

## Speeds up config syncing for mods built on ServerSync or ServerCharacters by raising their 20 KB send limit, and stops them dropping slow players after 30 seconds. Turn off if you suspect it conflicts with one of those mods. Server and client; requires a restart.
# Setting type: Boolean
# Default value: true
Enable Bulk Transfer Queue Boost = true

## Share of the Steam send buffer that all ServerSync mods together may use with 'Enable Bulk Transfer Queue Boost' on, so they cannot crowd out world updates. Lower it if players disconnect in busy areas; raise it if config sync on join is slow. Never goes below vanilla's 20 KB per mod.
# Setting type: Int32
# Default value: 40
# Acceptable value range: From 10 to 80
Bulk Transfer Budget Percent = 40

## Sizes how much world data each Steam connection may have in flight from that link's own health, instead of vanilla's fixed 10 KB. Off = Queue Size for everyone; crossplay players use Crossplay In-Flight KB. Client and server.
# Setting type: Boolean
# Default value: true
Adaptive Send Window = true

## The most data, in KB, Adaptive Send Window lets be on its way over one connection at once. Has no effect while Adaptive Send Window is off. Client and server.
# Setting type: Int32
# Default value: 1024
# Acceptable value range: From 64 to 8192
Max Send Window = 1024

## How much world data may be in flight over a crossplay (PlayFab) connection, in KB (vanilla is about 40). Lower makes a lost packet cost less; higher sends more on a long link. Client and server.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 8 to 128
Crossplay In-Flight KB = 20

## Vanilla sends world updates to one player per frame, so updates slow as the server fills. With this on, every player gets them at the ZDO Send Rate, within Send Budget Per Frame. Client and server.
# Setting type: Boolean
# Default value: true
Send To Every Player Each Frame = true

## Milliseconds per frame Send To Every Player Each Frame may spend building world updates. Players left over are served first next frame, and at least one is always served. Raise it on a busy server with CPU to spare.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0.5 to 20
Send Budget Per Frame = 4

