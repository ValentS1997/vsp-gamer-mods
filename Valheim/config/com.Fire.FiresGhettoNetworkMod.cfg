# Setting type: Single
# Default value: 8
# Acceptable value range: From 0 to 120
Settle Minimum Seconds = 8

## Stop waiting for the connection to settle after this many seconds and test anyway. A result taken
## this way can raise your tier but never lower it, and is not saved, so the next join tests again.
