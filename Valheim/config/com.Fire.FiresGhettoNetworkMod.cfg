## Client only.
# Setting type: Boolean
# Default value: false
Enable Client-Side Prediction = false

## For Client-Side Interpolation only. A player whose updates arrive less than this many seconds
## apart is drawn as vanilla, unsmoothed. 0 = always smooth.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 0.2
Smoothing Min Interval (s) = 0

## For Client-Side Interpolation only. A player whose updates arrive this far apart (seconds) or more
## gets full smoothing; between Min and Max it fades in. Lower means more smoothing on good connections.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0.05 to 0.5
Smoothing Max Interval (s) = 0.2

## Draws other FGN players smoothly from their time-stamped updates; others, and players on a ship or cart, are
## drawn as vanilla. Replaces Client-Side Interpolation and Prediction while on. Client only.
# Setting type: Boolean
# Default value: true
Remote Motion (experimental) = true

## Adds a timestamp (8 bytes) to your own movement updates so other players' Remote Motion can draw you smoothly.
