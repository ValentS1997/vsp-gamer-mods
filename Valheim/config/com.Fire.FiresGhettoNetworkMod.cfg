Adaptive Throttling = true

## How full a player's send window must get, in percent, before 'Adaptive Throttling' counts the connection as
## backed up. Lower = kicks in sooner. Dedicated server only.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 10 to 100
Congestion Threshold = 50

## Moves a creature to the player fighting it, or to a nearby player with clearly lower ping. Each move resets its AI,
## so group fights can look desynced. Does nothing under Server-Side Simulation. Dedicated server; FGN players only.
# Setting type: Boolean
# Default value: false
Balance Creature Ownership = false

## Balance Creature Ownership: how much lower, in ms, a nearby player's ping must be before a creature nobody is fighting moves to them. Higher means fewer moves. Dedicated server.
# Setting type: Int32
# Default value: 40
# Acceptable value range: From 10 to 300
Ownership Ping Margin = 40

## PvP only. A hit landing just after your dodge ended (up to 200 ms, based on ping) still counts as dodged, fixing
## "I dodged but still got hit" at a small cost to attackers. Set it on the server; applies to players running FGN.
# Setting type: Boolean
# Default value: false
PvP Lag-Fair Dodge = false

## When your bag is full or you are at your weight limit, walking past a dropped item no longer takes it over from the
## player who can pick it up (vanilla takes it first and checks your bag after, so a full player could block a pickup).
# Setting type: Boolean
# Default value: true
Auto-Pickup Claims Only What You Can Carry = true

[11 - Ship Fixes]

## When the dedicated server simulates ships, keeps the speed and rudder the steering player set instead of
## resetting them. Only applies with Server-Side Simulation on; requires a restart.
# Setting type: Boolean
# Default value: true
Enable Universal Ship Fixes = true

## Lets Selective server ownership claim ships as well as creatures, so the dedicated server runs their physics.
## Off = ships stay with the players as in vanilla. Broad ownership claims ships either way. Requires a restart.
# Setting type: Boolean
# Default value: false
Server-Side Ship Simulation = false

## Hands a ship to the player who takes the helm, so it no longer reacts late, with no wave-slam hit on hand-over.
## With Server-Side Ship Simulation an empty ship at rest returns to the server after 5 s. Only the owner needs FGN.
# Setting type: Boolean
# Default value: true
Give The Ship To Its Helmsman = true

[12 - Advanced]

## Stops vanilla teleporting creatures and tombstones up through a floor that sits below ground level (a cellar
## under a mound): before treating them as fallen out of the world, it checks for a real surface underneath.
# Setting type: Boolean
# Default value: true
Fix Ground Snap Through Floors = true

## Diagnostic: logs each player's send-queue health every 10 seconds (one line per player). Useful when
## investigating lag; leave off for normal play. Dedicated server only.
# Setting type: Boolean
# Default value: false
Log Send Queue Heartbeat = false

## Diagnostic: at startup, logs every mod's patches on the AI, object-creation and zone-loading methods FGN relies on,
## to track down mod conflicts. Dedicated server with Server-Side Simulation on only.
# Setting type: Boolean
# Default value: false
Enable Boot Patch Verification = false

## Diagnostic: when vanilla logs 'Writing a lot of data ... is not optimal', also logs which object caused it
## (prefab, position, owner). Turn on to track that warning down; leave off otherwise.
# Setting type: Boolean
# Default value: false
Enable Large ZDO Diagnostics = false

## After an object's first full send, only the values that changed are sent again, which saves a lot of bandwidth
## for creatures and players. Applies to server and client sends. Requires a restart.
# Setting type: Boolean
# Default value: true
Enable ZDO Delta Compression = true

## Writes outgoing objects with the same bytes as vanilla but without its temporary memory use, cutting garbage
## collection hitches. Checks itself against vanilla at the start of each session and falls back if anything differs.
## Affects this machine only; takes effect live.
# Setting type: Boolean
# Default value: true
Allocation-free ZDO Writes = true

## Skips the wear and support update for fully invulnerable building pieces (all damage Immune or Ignored, e.g.
## Infinity Hammer pieces) that the server owns. Other pieces are unchanged. Dedicated server; requires a restart.
# Setting type: Boolean
# Default value: true
Enable WearNTear Server Optimization = true

## Client counterpart of the WearNTear server optimization: skips the costly support check for fully invulnerable
## pieces and keeps them at full support, so pieces resting on them are unaffected. Big CPU saving in large bases
## built with such pieces.
# Setting type: Boolean
# Default value: true
Enable Invulnerable Support Skip = true

## With Server-Side Simulation on, if removing objects hits a broken entry left behind by another mod, clears those
## entries and retries instead of erroring. Each cleanup is logged; repeated ones point to a conflicting mod.
## Dedicated server only.
# Setting type: Boolean
# Default value: true
Enable Instance Orphan Prune = true

## Fixes a vanilla bug where a player (or anything) that teleports away stays visible to others, frozen where it
## left. Steps aside if the game or another mod (such as ValheimCommunityPatch) already fixes it. Server or host only.
# Setting type: Boolean
# Default value: true
Fix Teleport Ghost Players = true

## On a busy server with a low frame rate, vanilla's sleep skip can keep everyone in bed for a minute or more.
## With this on, morning arrives on time however busy the server is. Server or host only.
# Setting type: Boolean
# Default value: true
Fix Slow Sleep On Busy Servers = true

## Sends keepalives ahead of queued data, so a large transfer (such as a big base loading in) cannot time a
## player out while data is still arriving. Works on whichever side has it; best on server and clients.
# Setting type: Boolean
# Default value: true
Keep Busy Connections Alive = true

## When the server has very slow frames, its world clock falls behind real time and every player's clock jumps
## back to match. With this on, the server adds the lost time back so the clock keeps real time. Dedicated server.
# Setting type: Boolean
# Default value: true
Keep World Clock At Real Time = true

## Eases in the server's regular clock corrections instead of jumping, so waves, ships and timers do not visibly
## jerk. Large changes (sleeping, joining, an admin setting the time) still apply at once. Client side, per player.
# Setting type: Boolean
# Default value: true
Smooth Server Clock Corrections = true

## Vanilla can lose an item put into or taken from a smelter, kiln, fire or other station when your game is wrong about
## who runs it. With this on, the server routes it to whoever really does. Takes effect live. Dedicated server only;
## players do not need FGN.
# Setting type: Boolean
# Default value: true
Fix Lost Station Inserts = true

## Vanilla drops anyone silent for 30 s, which cuts off slow machines that freeze while loading a big world.
## A joining player is instead kept until their first spawn, for at most this many seconds after connecting;
## after that vanilla's timeout applies. 0 = vanilla. Server only.
# Setting type: Int32
# Default value: 300
# Acceptable value range: From 0 to 600
Join Grace Seconds = 300

## Crossplay (PlayFab) only. Stops vanilla's crossplay compression blocking the game, which can delay sends (even
## relayed PvP hits) by hundreds of ms. Same messages, same order. Client and server; requires restart.
# Setting type: Boolean
# Default value: true
Fix PlayFab Compression Stalls = true

[13 - Compatibility]

## When true, the server disconnects a client whose FGN version differs from its own (it is told why first).
## A client without FGN can always join. When false, such a client plays with FGN's network features off for it.
## Server or host only.
# Setting type: Boolean
# Default value: false
Refuse Mismatched FGN Clients = false

## Server only. When a world script (e.g. Expand World Prefabs) writes to an object a player owns, keep that write only one
## revision ahead of the player instead of far ahead, so it cannot overwrite the player's newer position or changes
## (a teleporting player lost, sign text reverted). Players without FGN merge it by vanilla's own rule.
# Setting type: Boolean
# Default value: true
Owner-Safe Server Writes = true

[14 - Diagnostics]

## Checks every player's outgoing send queue every 5 s and logs the largest each minute, as a share of the Steam send buffer, to show how close live traffic gets to filling it. Costs nothing while off. The fgn_headroom console command prints a snapshot either way. Server only (dedicated or hosting).
# Setting type: Boolean
# Default value: false
Send Queue Headroom Monitor = false

## Logs every send rate step for each connection, about once a second: ping, send window, data in flight, Steam wait, delivery, pacing, goodput and the decision. Noisy; for tuning only. Logs on a server (Adaptive Send Rate) and on a client (Adaptive Upload).
# Setting type: Boolean
# Default value: false
Log Adaptive Send Rate Ticks = false

[15 - API]

## Which FGN settings other mods may override for a session through FGN's public API: 'all', 'none', or a comma list of
## keys (server.simulation, server.ownership, server.ownership.selective, creatures.ownership, stations.routing).
## Every override is logged with the mod that asked; your config file is never changed by it.
# Setting type: String
# Default value: all
Allow Overrides = all

