# Setting type: Single
# Default value: 300
# Acceptable value range: From 30 to 900
Settle Ceiling Seconds = 300

## How many seconds the connection must stay quiet or steady before it counts as settled. Higher is
## more careful but starts the test later. Client only.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 1 to 60
Settle Quiet Hold Seconds = 6

## Upload plus download to the server, in KB/s, below which the connection counts as idle. A busier
