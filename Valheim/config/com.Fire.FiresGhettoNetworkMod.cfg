## the server skips areas where nothing changed and nothing is owed to that player. Dedicated server only.
# Setting type: Boolean
# Default value: true
Skip Unchanged Areas = true

## Goes further than Skip Unchanged Areas, which cannot skip a busy base where something is always changing: in an
