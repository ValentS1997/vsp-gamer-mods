## Settings file was created by plugin BountyBoard v1.4.4
## Plugin GUID: com.quad.bountyboard

[Building]

## What a bounty board costs to build with the hammer (at a workbench). Item prefab names and amounts, separated by commas, like FineWood:12, BronzeNails:30 (Claude Tools' `prefabs <text>` shows exact names). A cost with a mistake in it keeps the last good one. [Synced with Server]
# Setting type: String
# Default value: Wood:20, LeatherScraps:6, Flint:4
Cost = Wood:20, LeatherScraps:6, Flint:4

[Contracts]

## How many contracts the group can have going at once. A new one can only be taken when one is finished. In multiplayer the server's value applies.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 1 to 5
MostAtOnce = 3

## Pay as a percentage of the standard rate (50 = half, 200 = double). In multiplayer the server's value applies.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 10 to 500
RewardPercent = 100

[Notices]

## How many in-game days before the board posts new notices. In multiplayer the server's value applies.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 7
DaysBetweenNewNotices = 1

## How many notices are posted. In multiplayer the server's value applies.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 3 to 8
NoticesPerBoard = 5

[Tracker]

## Show the group's contracts and their progress on your screen (also a switch in the board's menu).
# Setting type: Boolean
# Default value: false
ShowOnScreen = false

## Distance from the left edge of the screen (UI pixels).
# Setting type: Single
# Default value: 14
X = 14

## Distance from the top of the screen (UI pixels).
# Setting type: Single
# Default value: 330
Y = 330

## Size of the tracker.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.6 to 2
Scale = 1

