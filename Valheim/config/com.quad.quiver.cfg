## Settings file was created by plugin Quiver v0.2.4
## Plugin GUID: com.quad.quiver

[Arrows]

## Arrows you shoot that hit something land on the ground as arrows you can pick up again. In multiplayer the server's value applies.
# Setting type: Boolean
# Default value: true
PickUpArrows = true

## The chance an arrow that hit the ground, a tree, a wall or the like is kept. 1 keeps every one. In multiplayer the server's value applies.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
ChanceOnGround = 0.75

## The chance an arrow that hit a creature is kept: it drops with that creature's loot when it dies. 0.75 keeps three in four. In multiplayer the server's value applies.
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0 to 1
ChanceOnCreature = 0.75

## Crossbow bolts can be picked up too. In multiplayer the server's value applies.
# Setting type: Boolean
# Default value: true
IncludeBolts = true

## Fire arrows are always used up. In multiplayer the server's value applies.
# Setting type: Boolean
# Default value: true
FireArrowsBurnUp = true

## Write what each arrow hit did (kept, broke, why not) to the BepInEx log. For finding out why an arrow did not come back.
# Setting type: Boolean
# Default value: false
LogHits = false

[Quiver]

## A quiver on your back while you have arrows (or bolts) equipped.
# Setting type: Boolean
# Default value: true
Show = true

## How far behind your spine the quiver hangs (metres).
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0.05 to 0.4
Back = 0.2

## How far to your right it hangs (negative: left).
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From -0.3 to 0.3
Side = 0.1

## How far up it hangs (negative: lower).
# Setting type: Single
# Default value: -0.03
# Acceptable value range: From -0.4 to 0.4
Height = -0.03

## How far the top leans to your right (degrees).
# Setting type: Single
# Default value: 22
# Acceptable value range: From -45 to 45
TiltSide = 22

## How far the top leans backwards (degrees).
# Setting type: Single
# Default value: 8
# Acceptable value range: From -45 to 45
TiltBack = 8

