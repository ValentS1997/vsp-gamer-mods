## Settings file was created by plugin AutoServerPassword v1.0.2
## Plugin GUID: Allifreyr.AutoServerPassword

[General]

## Master switch to enable or disable the AutoServerPassword mod.
# Setting type: Boolean
# Default value: true
Enabled = true

## Key to toggle the AutoServerPassword in-game manager window. Change this to any key to avoid conflicts with dev console mods.
# Setting type: KeyboardShortcut
# Default value: F7
ToggleHotkey = F7

## Optional alternate key to toggle Valheim's developer console. Useful if a dev console mod overrides or conflicts with F5.
# Setting type: KeyboardShortcut
# Default value: None
ConsoleHotkey = 

## Automatically submit the saved password when connecting to a known server.
# Setting type: Boolean
# Default value: true
AutoSubmit = true

## If true, the password prompt dialog will not render when a saved password is automatically entered.
# Setting type: Boolean
# Default value: true
HidePasswordDialog = true

## Automatically save the password for a server after successfully connecting with it.
# Setting type: Boolean
# Default value: true
AutoSave = true

## Automatically remove the saved password if the server rejects it (e.g. if the server password changed), so you are prompted next time.
# Setting type: Boolean
# Default value: true
PurgeOnWrongPassword = true

[UI]

## Show an in-game HUD notification when a password is auto-submitted or saved.
# Setting type: Boolean
# Default value: true
ShowNotifications = true

## In the server browser list, tint the lock icon green and note in tooltip for servers that have saved passwords.
# Setting type: Boolean
# Default value: true
HighlightSavedInServerList = true
