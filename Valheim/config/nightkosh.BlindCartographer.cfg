## Settings file for BlindCartographer v1.0.3
## Plugin GUID: nightkosh.BlindCartographer
## Configuration based on the published source defaults (not yet generated by the game).

[General]

## Enables the mod.
ModEnabled = true

[Map]

## In No Map worlds, read the map at the cartography table.
## Replaces the functionality of NoMapCartographyTable.
EnableCartographyTableInNoMapMode = true

[Hotkeys]

## Allow placing pins without opening the map.
EnableHotKey = true

## Show the hotkey in hover hints.
ShowHotKeyText = true

## Hold LEFT ALT and press this key to name and place a map pin.
HotKey = Y
