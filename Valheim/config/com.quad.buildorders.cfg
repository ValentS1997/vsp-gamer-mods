[Bridge]

## Deck width in metres (2, 4 or 6). The last bridge's choices are kept.
# Setting type: Int32
# Default value: 2
# Acceptable values: 2, 4, 6
Width = 4

## Wood; CoreWood (round logs from pines: stronger, reaches deeper water); Darkwood (needs tar); Stone (stone floors on stone pillars, needs a stonecutter).
# Setting type: BridgeMaterial
# Default value: Wood
# Acceptable values: Wood, CoreWood, Darkwood, Stone
Material = Stone

## Rails (posts and a handrail), HalfWalls (a low wall along each side) or None (cheapest).
# Setting type: BridgeSides
# Default value: Rails
# Acceptable values: Rails, HalfWalls, None
Sides = HalfWalls

## A roof over the deck on tall posts (a covered bridge).
# Setting type: Boolean
# Default value: false
Roof = false

## Posts down to the riverbed: Auto (every 2 m in deep water, else 4 m), Every2m (strongest) or Every4m (cheapest). Stone always has a pillar under every slab.
# Setting type: BridgeSupports
# Default value: Auto
# Acceptable values: Auto, Every2m, Every4m
Supports = Auto

## Straight from end to end, or Arched (the middle raised in a gentle curve).
# Setting type: BridgeShape
# Default value: Straight
# Acceptable values: Straight, Arched
Shape = Straight

## Sloped (the deck slopes from one bank's height to the other's) or Steps (a level deck, with steps down at the lower end).
# Setting type: BridgeEnds
# Default value: Sloped
# Acceptable values: Sloped, Steps
Ends = Steps

## Standing torches along the deck every 8 m (wood and resin).
# Setting type: Boolean
# Default value: false
Torches = false

[General]

## Turn the mod on or off.
# Setting type: Boolean
# Default value: true
Enabled = true

## Show the glowing ghosts of planned pieces.
# Setting type: Boolean
# Default value: true
ShowGhosts = true

## Walk up to a ghost and press E to build it, no hammer needed. It costs the normal materials (from your inventory, then nearby chests if BuildFromChests is installed).
# Setting type: Boolean
# Default value: true
BuildByPressingUse = true

## Keep your hammer in your hand while swimming so you can plan and build from the water (equip it before you jump in: the game does not let you equip things while swimming).
# Setting type: Boolean
# Default value: true
BuildWhileSwimming = true

## Holding E at a ghost (or Build nearby in the Plans window) builds every ghost within this many metres, lowest first, as far as your materials go. In multiplayer the server's value applies.
# Setting type: Single
# Default value: 24
# Acceptable value range: From 4 to 64
BuildAllRadius = 24

## Show the stability colours automatically while plan mode is on.
# Setting type: Boolean
# Default value: true
StabilityInPlanMode = true

## How close (in metres) you must be to a ghost to build it by pressing E. In multiplayer the server's value applies.
# Setting type: Single
# Default value: 6
# Acceptable value range: From 2 to 10
UseReach = 6

## Ghosts further than this many metres away are hidden (saves performance).
# Setting type: Single
# Default value: 80
ViewDistance = 80

## Most ghosts shown at once (the nearest first). Big plans need more; very high numbers can cost frame rate.
# Setting type: Int32
# Default value: 600
# Acceptable value range: From 50 to 2000
MaxGhosts = 600

## When you're placing the same piece as a nearby order, your placement ghost snaps onto the order if it's within this many metres.
# Setting type: Single
# Default value: 1.5
SnapDistance = 1.5

