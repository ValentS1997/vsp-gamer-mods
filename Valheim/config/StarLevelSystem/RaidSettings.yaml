#################################################
# Star Level System Expanded - Raid Settings
#
# Defines the SLS raid events that replace vanilla random events. Per-player:
# the server checks each player's progression keys and cooldowns and starts
# raids on eligible players. Set UseVanillaRaidConfiguration in the main .cfg
# to true to disable all of this and keep vanilla events.
#
# SERVER AUTHORITATIVE: the server's copy is synced to clients; editing this
# on a client does nothing. Edits apply live.
#
# DO NOT edit RaidVersion: a version that does not match this build resets
# the whole file to the defaults on load, unless the versions since only added
# new raids; then those are added and everything else is kept. The previous
# file is saved next to this one as RaidSettings.yaml.v<old version>.<date>.bak
# first, so your own raids can be copied back in.
#
# --- GlobalSettings ---
#   GlobalSettings:
#     DisableAllRaids: false
#     PlayerBasedRaids: true         # raids target individual players
#     GlobalRaidIntervalScalar: 2    # multiplies every raid's cooldown: >1 = raids less often
#     GlobalRaidChanceScalar: 0.5    # multiplies every raid's activation chance
#     RaidCreatureDensity: 2         # 1-6, how crowded the raids below already are
#     PauseBeforeCompleted: 30       # seconds a raid stays active after its Duration so its
#                                    # creatures can be finished off; killing them all ends it early
#
# The world's own Raids modifier applies on top of both scalars the way vanilla
# applies it to its events: None starts no raids, Less (1.5x) and Much less (2x)
# lengthen cooldowns and divide chances by the same amount, More and Much more
# shorten and raise them.
#
# RaidCreatureDensity is a record, not a multiplier: nothing reads it while a
# raid runs. The quick configure panel's "Raid creature density" slider
# rewrites every SpawnGroupSize and MaxSpawned below when you move it (never
# below 1) and stamps where it left them here. The next move rescales counts
# still as shipped from the raids' designed numbers, and counts you changed
# from the file as written, so neither compounds. 3 is those designed numbers,
# new files ship at 2, 1 is roughly vanilla sized and 6 is not meant to be
# survivable. Edit the slider rather than this number - changing it by hand
# only makes the next slider move scale by the wrong amount.
#
# --- Raids ---
# Each raid: what unlocks it, how it announces itself, and what it spawns.
#
#   Raids:
#   - Name: my_swamp_raid            # unique; also used for cooldown tracking
#     Duration: 120                  # seconds of active spawning
#     RaidActiveTillDefeated: false  # true: after Duration, stays active until its creatures die (at most
#                                    # RaidActiveTillDefeatedMaxSeconds from the main .cfg); false (default)
#                                    # waits PauseBeforeCompleted from GlobalSettings instead
#     RaidCoolDownMinutes: 240       # per-player cooldown for THIS raid
#     EventRange: 96                 # radius of the event circle
#     StartMessage: $SLS_my_raid_start   # localization tokens or plain text
#     EndMessage: $SLS_my_raid_end
#     ForceEnvironment: SwampRain    # weather while the raid runs
#     ForceMusic: ZCombatEventL2     # combat music layer
#     Activation:
#       Chance: 25                   # 0-100, rolled each raid check
#       RequiredGlobalKeys: [ defeated_gdking ]    # world progression gates
#       RequiredPlayerKeys: [ KilledTroll ]        # per-player keys (all needed)
#       AnyRequiredPlayerKeys: []    # any one of these is enough
#       NotRequiredGlobalKeys: []    # blocks the raid when present
#       NearBaseOnly: false          # true: only while the player is within 30m of a base piece (workbench, fire, bed...)
#       PauseIfNoPlayerInArea: true
#     Spawns:
#     - PrefabName: Draugr
#       SpawnInterval: 13            # seconds between spawn waves
#       SpawnChance: 100             # chance per wave
#       SpawnGroupSize: 2            # creatures per wave
#       MaxSpawned: 6                # cap on this entry's living creatures
#       MaxSpawnTriggers: 0          # 0 = unlimited waves during the duration
#       InitalSpawnDelay: 0
#       CreatureAI: HuntPlayer       # HuntPlayer (default), Alerted or AgitatedByBuild
#                                    # Raid and nemesis spawns are always woken, so cave dwellers such as
#                                    # Ulv and Fenring_Cultist engage immediately instead of spawning asleep.
#       Faction: Undead
#       LevelMin: 3                  # rolled levels are raised to at least this
#       LevelMax: 10                 # and capped here; 0 or left out = MaxLevel from the main .cfg
#       UseRaidLevelSystem: true     # roll levels from the tables below
#       CustomCreatureLevelUpChance: { 3: 100, 5: 50, 10: 5 }
#       LevelupGeneratorRefs: []     # or reference LevelSettings generators
#       RequiredModifiers: { Fire: Major }
#       ModifiersNotAllowed: [ Splitter ]
#
# Raid start/end messages support localization tokens ($...), and the shipped
# raids are a good reference for working key/environment/music values.
#################################################
