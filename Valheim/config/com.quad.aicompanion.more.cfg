[Companion]

## It fights enemies that come this close (in metres) to it or to you. In the menu: Orders.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 5 to 50
FightRange = 12

## Show what it decides in a fight above its head. In the menu: Brain.
# Setting type: Boolean
# Default value: true
ShowDecisions = true

## Seconds after falling before it wakes in its bed (or beside you). In multiplayer the server's value applies.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 5 to 600
RespawnSeconds = 30

## Its health before food, as a player's (25). In multiplayer the server's value applies.
# Setting type: Single
# Default value: 25
# Acceptable value range: From 5 to 500
BaseHealth = 25

## Its stamina before food, as a player's (75). In multiplayer the server's value applies.
# Setting type: Single
# Default value: 75
# Acceptable value range: From 10 to 500
BaseStamina = 75

## It eats a food it is already under again once its time left drops below this percent (the game allows it from 50). Lower saves food: a meal lasts 80% of its time instead of 50%, and its effect weakens a little towards the end. In multiplayer the server's value applies.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 50
EatBelowPercent = 10

## The skill level a new companion starts at (a new player: 0). In multiplayer the server's value applies.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 100
StartingSkill = 0

[EpicMMO]

## With EpicMMO System installed: the experience a companion earns from its kills and its work (chopping, mining, picking), as a multiple of what a player gets for them (EpicMMO's RateExp counts too). 0: companions don't level up, and their levels give nothing. Their kills count for their player as a tame's whatever this is (EpicMMO's "Tames give XP on Mob kill"). In multiplayer the server's value applies.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
CompanionExp = 1


