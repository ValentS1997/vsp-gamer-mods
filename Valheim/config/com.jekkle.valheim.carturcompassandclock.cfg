## Settings file was created by plugin Cartur's Compass and Clock v1.5.6
## Plugin GUID: com.jekkle.valheim.carturcompassandclock

[General]

## Only show map pins within this many meters.
# Setting type: Single
# Default value: 300
PinRange = 300

## Which grave markers the compass draws. All: every death pin still on your map, at any distance - graves ignore PinRange, so a long-lived character shows every grave it ever left. InRange: graves obey PinRange like everything else, so the one you just made still shows while you walk back to it and the old ones stop crowding the bar. Off: no grave markers at all. This only changes the compass; your map is untouched either way.
# Setting type: DeathMarkerMode
# Default value: All
# Acceptable values: All, InRange, Off
DeathMarkers = InRange

## Total degrees of heading visible across the compass window.
# Setting type: Single
# Default value: 90
FieldOfView = 90

## Show the clock above the compass. Off hides it completely; the compass stays.
# Setting type: Boolean
# Default value: true
ShowClock = true

## Show the clock as 12-hour with AM/PM (1:05 PM). Off is 24-hour (13:05).
# Setting type: Boolean
# Default value: true
TwelveHourClock = false

## Show the time of day and the day number with the clock (Morning, Day 12 - 8:30 AM). Off shows the time alone.
# Setting type: Boolean
# Default value: true
ShowDay = false

## Custom clock text (Discord request). Empty keeps the built-in text, which TwelveHourClock and ShowDay control. Tokens: {phase} Morning/Afternoon/Night, {day} Day 12, {daynum} 12, {time} as TwelveHourClock says, {time12} 1:05 PM, {time24} 13:05, {hour} 13, {hour12} 1, {minute} 05, {ampm} PM. Words follow the game language. Example: {day} | {time24}. Unknown tokens are shown as typed.
# Setting type: String
# Default value: 
ClockFormat = 

## Size of the clock text. Separate from FrameWidth, so the clock can be bigger or smaller than the compass.
# Setting type: Int32
# Default value: 26
# Acceptable value range: From 10 to 60
ClockTextSize = 15

## Show the name and distance of the pin nearest the center of the compass, under the frame.
# Setting type: Boolean
# Default value: true
ShowPinNames = false

[Layout]

## Frame width, in reference-resolution pixels (1920x1080 basis - scales with screen size). Height follows the frame image's aspect ratio.
# Setting type: Int32
# Default value: 657
FrameWidth = 655

## Distance right of screen centre to the middle of the frame, in reference-resolution pixels (1920x1080 basis). Negative moves it left.
# Setting type: Single
# Default value: 0
FrameOffsetX = 2

## Distance from the top of the screen down to the frame's top edge, in reference-resolution pixels (1920x1080 basis). The clock sits directly above the frame.
# Setting type: Single
# Default value: 54
FrameOffsetY = 1024

## How solid the compass and clock are. 1 is fully solid, lower lets the game show through.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 1
Opacity = 0.4

## Bronze is the bronze frame. Rune is a flat dark panel with a thin black border, matching Cartur's RuneUI. Auto picks Rune when Cartur's RuneUI is installed, Bronze otherwise.
# Setting type: String
# Default value: Auto
# Acceptable values: Auto, Bronze, Rune
Style = Rune

## Draw a box around the compass and let you drag it to move it, or drag the grip on its right edge to resize it. The compass stays on screen while this is on, even in menus. Turn it off when you are happy with it.
# Setting type: Boolean
# Default value: false
EditMode = false

