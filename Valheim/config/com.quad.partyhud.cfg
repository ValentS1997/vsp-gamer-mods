## Settings file was created by plugin PartyHud v1.12.0
## Plugin GUID: com.quad.partyhud

[Appearance]

## Opacity of the entire HUD, including text, portraits, icons and bars: 0 = invisible, 1 = fully visible.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
HudOpacity = 1

## Size of member names, distances, status text and bar numbers. Header/FontSize controls the party title separately.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.75 to 1.25
TextScale = 1

[General]

## Show the party panel.
# Setting type: Boolean
# Default value: true
Enabled = true

## Include yourself in the panel.
# Setting type: Boolean
# Default value: true
ShowSelf = true

## Show each player's Steam profile picture. Off (or no picture available) = a coloured initial.
# Setting type: Boolean
# Default value: true
ShowPortraits = true

## Show how far away each player is.
# Setting type: Boolean
# Default value: true
ShowDistance = true

## Hide the panel while the inventory, crafting window, build menu, trader or big map is open, so it doesn't overlap them.
# Setting type: Boolean
# Default value: true
HideInMenus = true

## Most players to show (you first, then the rest alphabetically).
# Setting type: Int32
# Default value: 8
MaxPlayers = 8

## Press to hide or show the panel (handy for screenshots).
# Setting type: KeyboardShortcut
# Default value: F8
ToggleKey = F11

## Next to each player's distance, an arrow pointing the way they are, relative to where you are looking.
# Setting type: Boolean
# Default value: true
ShowDirectionArrow = true

## Show three food slots under each player's picture: what they are eating and how long it has left. Only for players who also have this mod.
# Setting type: Boolean
# Default value: true
ShowFood = true

## Show each player's buffs and debuffs (food, rested, wet, poison...) as small icons under their bars. Only for players who also have this mod.
# Setting type: Boolean
# Default value: true
ShowStatusEffects = true

## With the AICompanion mod: show each player's companion under them (health, distance, what it is doing).
# Setting type: Boolean
# Default value: true
ShowCompanions = true

[Header]

## Position of the party title's text box from the panel's left edge. Smaller values move it left; larger values move it right.
# Setting type: Single
# Default value: 36
# Acceptable value range: From -128 to 256
OffsetX = 36

## Position of the party title's text box from the panel's top edge. Smaller values move it up; larger values move it down.
# Setting type: Single
# Default value: 10
# Acceptable value range: From -64 to 128
OffsetY = 10

## Size of the party title and count before the whole HUD's Scale is applied. Long translated titles shrink to fit their text box.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 8 to 28
FontSize = 15

## Width of the party title's text box. Increase this with FontSize when a larger title needs more room.
# Setting type: Single
# Default value: 76
# Acceptable value range: From 48 to 180
Width = 76

[Layout]

## Gap from the chosen left or right edge, in UI pixels before Scale is applied.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 4096
OffsetX = 10

## Gap from the chosen top or bottom edge, in UI pixels before Scale is applied.
# Setting type: Single
# Default value: 300
# Acceptable value range: From 0 to 4096
OffsetY = 300

## Size of the whole HUD (1 = normal, 1.25 = bigger).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.35 to 2
Scale = 1

## Anchor the panel to the left edge instead of the right.
# Setting type: Boolean
# Default value: false
OnLeft = false

## Anchor the panel to the bottom edge instead of the top. OffsetY is then the gap from the bottom.
# Setting type: Boolean
# Default value: false
AnchorBottom = false

## Use smaller portraits and thinner bars.
# Setting type: Boolean
# Default value: false
Compact = false

## Width of each member row in normal mode, before Scale is applied.
# Setting type: Single
# Default value: 320
# Acceptable value range: From 240 to 640
Width = 320

## Width of each member row in compact mode, before Scale is applied.
# Setting type: Single
# Default value: 252
# Acceptable value range: From 200 to 400
CompactWidth = 252

## Gap between member rows, in UI pixels before Scale is applied.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 20
RowSpacing = 3

## Shrink the HUD when necessary to fit its width and height inside the screen.
# Setting type: Boolean
# Default value: true
FitToScreen = true

## Keep the HUD inside the screen when an offset would push it outside.
# Setting type: Boolean
# Default value: true
KeepOnScreen = true

## Move the panel away from the ship display while you steer.
# Setting type: Boolean
# Default value: true
AvoidShipHud = true

## Opacity of the wood and carved frame: 0 = clear, 1 = solid. Text, portraits and bars stay visible.
# Setting type: Single
# Default value: 0.85
# Acceptable value range: From 0 to 1
Opacity = 0.85

[Sharing]

## Send your health, stamina, Eitr, food and buffs to the other players who have this mod (a few times a second, at any distance). Off: they only see what the game itself shows of you when you are near.
# Setting type: Boolean
# Default value: true
ShareMyStats = true

## Players with this mod share their exact health, stamina, Eitr, food and buffs with each other at any distance. A PvP server may want this off (each player then sees only what the game shows of players near them). In multiplayer the server's value applies.
# Setting type: Boolean
# Default value: true
AllowSharing = true

