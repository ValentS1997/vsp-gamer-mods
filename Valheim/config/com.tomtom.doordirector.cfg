## DoorDirector 0.3.0 — VSP Gamer baseline (selected 2026-10-23).
## Prepared from upstream DoorDirectorPlugin.cs defaults; not a file exported from the game.
## Install DoorDirector.dll on the hosting client and every connecting player.
## F7 diagnostic shortcut intentionally disabled: F7 is used by Quads Build Orders.
## Use the in-game console command: doordirector_prefab

[1 - General]

## Automatically close opened doors and gates; never open them automatically.
Enabled = true

## Server-controlled configuration.
Lock Configuration = true

## Seconds after a Door opens before it automatically closes.
Default Auto Close Delay = 5

[2 - Prefab Rules]

## false: affect all Valheim Door components except ignored prefabs.
Only Affect Configured Prefabs = false

## Comma-separated prefab names, for normal open/close state.
Included Prefabs =

## Only for prefabs whose physical open state is opposite their logical Door state.
Inverted Prefabs =

## Do not auto-close these prefabs (empty: none excluded).
Ignored Prefabs =

## Optional per-prefab delay: prefab_name=seconds,comma-separated.
Custom Delays =

[3 - Player Doors]

## Allow the builder to toggle auto-close on a particular door or gate.
Allow Owned Door Controls = true

## Delay used when a particular built door is enabled without its own override.
Owned Door Auto Close Delay = 5

## Client-only: toggle on a targeted door that you built.
Owned Door Toggle Hotkey = G + LeftShift

## Client-only: set a custom delay on a targeted door that you built.
Owned Door Set Delay Hotkey = T + LeftShift

[4 - Diagnostics]

Debug Logging = false

## Upstream default F7 conflicts with Quads Build Orders. Console command remains available.
Prefab Debug Hotkey = None
