## Settings file was created by plugin Sinka v1.3.1
## Plugin GUID: ezomic.valheim.sinka

[Centring]

## Aim a piece listed in CentreProps at the top face of any piece and it lands centred on that face. It centres only while the crosshair is on an upward face level with the target's top, and nothing ever snaps to the prop afterwards. Hold the place-without-snapping key to place it where you aim.
# Setting type: Boolean
# Default value: true
CentreOnSurface = true

## Comma-separated prefab names of the standing props that centre. Kept to the two floor braziers rather than every fire in the game: the bonfire and hearth names have not been confirmed against a running game, and a name that matches no prefab is reported in the log at startup, so adding one is safe to try.
# Setting type: String
# Default value: piece_brazierfloor01, piece_brazierfloor02
CentreProps = piece_brazierfloor01, piece_brazierfloor02

[Diagnostics]

## Log the measured footprint of every piece that gets snap points, and the colliders it was measured from.
# Setting type: Boolean
# Default value: false
Verbose = false

[Snapping]

## Snap anything buildable that holds items. Matched on components, so modded chests are covered without naming them.
# Setting type: Boolean
# Default value: true
SnapContainers = true

## Snap the fences and stake walls listed in FencePrefabs.
# Setting type: Boolean
# Default value: true
SnapFences = true

## Snap every buildable piece the game never gave snap points to. Catches modded pieces for free, but also chairs, banners and item stands, where snapping tends to fight you rather than help.
# Setting type: Boolean
# Default value: false
SnapUnsnappedPieces = false

## Only snap pieces that actually appear in a build menu. Off means anything with a Piece component qualifies, which includes dungeon loot chests and pots you cannot place and probably do not want to snap to.
# Setting type: Boolean
# Default value: true
BuildablePiecesOnly = true

## Comma-separated prefab names treated as fences. Names that do not exist are reported in the log at startup.
# Setting type: String
# Default value: wood_fence, piece_sharpstakes, piece_stakewall_blackwood, piece_dvergr_sharpstakes, piece_dvergr_stake_wall
FencePrefabs = wood_fence, piece_sharpstakes, piece_stakewall_blackwood, piece_dvergr_sharpstakes, piece_dvergr_stake_wall

## Comma-separated prefab names to leave alone, whatever else matches.
# Setting type: String
# Default value: 
ExcludePrefabs = 

## Exact snap points for named prefabs, replacing anything derived. Format:
## #   prefab: x,y,z | x,y,z ; other_prefab: x,y,z
## # Semicolons separate prefabs, a colon follows the name, pipes separate
## # points, commas separate the three coordinates of one point. Naming a
## # prefab here is enough to get it snapped - it does not also have to be a
## # container or a listed fence. Decimals must use a dot, never a comma,
## # because a comma already separates coordinates. Gap and the fence ladder
## # do not apply: a point given here is used exactly as written.
# Setting type: String
# Default value: 
PointOverrides = 

## Metres of space left between two chained pieces. 0 places them flush. Negative values are ignored - overlapping pieces just clip.
# Setting type: Single
# Default value: 0
Gap = 0

## Gap for named prefabs, overriding Gap for those and leaving the rest alone.
## # Format:  prefab: metres ; other_prefab: metres
## # Semicolons separate prefabs and a colon follows the name. Decimals must
## # use a dot. Negative values are ignored, as with Gap, and a name that
## # matches no prefab is reported in the log at startup. Points given by hand
## # through PointOverrides are used exactly as written and take no gap at all.
# Setting type: String
# Default value: 
GapOverrides = 

## Vertical spacing of the snap points up each end of a fence, in metres. Smaller follows sloping ground more closely and costs more points per piece. 0 turns the ladder off and gives fences plain corners like a chest.
# Setting type: Single
# Default value: 0.2
FenceLadderStep = 0.2

## How far below its own base a fence's lowest rung sits, in metres. This is what lets the next panel step down rather than only up.
# Setting type: Single
# Default value: 0.2
FenceLadderBelow = 0.2

[Sockets]

## Aim a piece listed in Sockets at the top of one of its targets and it snaps down into it, centred, with only its head standing above the top - a torch on a post. It snaps only while aimed at the target's top face, to that one target and nothing else, and nothing ever snaps to the piece afterwards. Hold the place-without-snapping key to set a torch on a pole top without sinking it.
# Setting type: Boolean
# Default value: true
SnapSockets = true

## What sinks into what, and how much of it still shows. Format:
## #   piece, piece : target, target : metres showing ; next entry
## # Semicolons separate entries, colons separate an entry's three fields, and
## # commas separate names within a field. Decimals must use a dot.
## #
## # The third field is optional. Left out, the depth is measured off the piece
## # itself: as deep as it can sink while the zone a burning torch spreads fire
## # into stays clear of its own pole, which in the Ashlands is what stops the
## # pole burning out from under it. A typed value below that floor is raised to
## # it with a warning, and one past the piece's own length is capped, since a
## # socket below its tip would leave it floating above the pole instead.
## #
## # A target needs snap points of its own for any of this to work, because the
## # highest of them is what the piece lands on - which is why a pole of any
## # length is covered without naming its length. The startup log names any
## # target that has none, is in no build menu, or matches no prefab at all.
# Setting type: String
# Default value: piece_groundtorch_wood : wood_pole, wood_pole2, wood_pole_log, darkwood_pole, darkwood_pole4, ashwood_pole_1m, ashwood_pole_2m : 0.25 ; piece_groundtorch, piece_groundtorch_blue, piece_groundtorch_green : wood_pole, wood_pole2, wood_pole_log, darkwood_pole, darkwood_pole4, ashwood_pole_1m, ashwood_pole_2m ; piece_groundtorch_mist : wood_pole, wood_pole2, wood_pole_log, darkwood_pole, darkwood_pole4, ashwood_pole_1m, ashwood_pole_2m : 0.27
Sockets = piece_groundtorch_wood : wood_pole, wood_pole2, wood_pole_log, darkwood_pole, darkwood_pole4, ashwood_pole_1m, ashwood_pole_2m : 0.25 ; piece_groundtorch, piece_groundtorch_blue, piece_groundtorch_green : wood_pole, wood_pole2, wood_pole_log, darkwood_pole, darkwood_pole4, ashwood_pole_1m, ashwood_pole_2m ; piece_groundtorch_mist : wood_pole, wood_pole2, wood_pole_log, darkwood_pole, darkwood_pole4, ashwood_pole_1m, ashwood_pole_2m : 0.27

## What a torch snapped into a pole keeps that pole safe from, for as long as the
## # torch stands in it. Removing the torch removes the protection.
## #   All  - every hit on the pole is ignored: creatures, players, fire, the
## #          Ashlands cinders. The pole can then only be taken down by hand.
## #   Fire - only fire is ignored: Ashlands cinders, burning, and the fire
## #          share of a mixed hit. Creatures and players still break the pole.
## #   Off  - no protection.
## # It applies to every pole named as a target in Sockets. Only a torch Sinka
## # snapped counts: one set on top with the place-without-snapping key does not.
## # The wear that brings down a pole with nothing under it is never prevented.
## # The game's owner of the pole decides, so a player running without Sinka who
## # owns a pole at that moment does not honour it.
# Setting type: Protection
# Default value: All
# Acceptable values: All, Fire, Off
ProtectFrom = All

[Stacking]

## Let a chest be placed on top of another chest, and stay there.
## # A chest holds up a chest and nothing else: a wall, a beam or a torch on a
## # chest is still refused, which is vanilla's answer rather than a limit of
## # this setting.
## #
## # ON A SERVER, READ THIS FIRST. Whether a piece is supported is worked out
## # by whichever player's game owns it, and ownership follows whoever is
## # nearby. A player who does not have Sinka works it out the vanilla way,
## # finds a chest standing on nothing, and DESTROYS IT WITH EVERYTHING IN IT.
## # There is no fix for that from here, because the rule runs on their
## # machine. A stack is safe in single player, and on a server where every
## # player has this mod - a modpack that carries it, for instance. On a server
## # where some players do not, turn this off and lose nothing but the feature.
## #
## # The build-integrity colours still show a stacked chest as unsupported.
## # That is only the colour: the chest is exempt from the wear that colour
## # usually warns about.
# Setting type: Boolean
# Default value: true
StackContainers = true

