deployment_classification_status:
  user_task: Разделить на Server & Client, Server Only и Client Only для выделенного сервера. Последний чат оборвался до готового
    подтверждённого списка.
  status: unfinished — THIS IS THE FIRST TASK FOR THE NEXT CONVERSATION
  warning: deploy_hypothesis values are NOT verified by plugin documentation. No mandatory server-only DLL can be asserted
    based on client plugin list alone.
  classes:
    server_and_client: Must be installed on both machines if mod adds shared prefabs/items, changes networked world state,
      or requires matching game logic; verify exact mod.
    server_only: No mod yet positively confirmed server-only in supplied list; do not invent one.
    client_only: UI, graphics, controls, convenience can often live only client-side; some still need server changes to operate
      in multiplayer.
    depends_or_optional: Some plugins sync settings if also installed on server but work client-side without it; libraries
      must follow their consuming plugin.
  special_notes:
  - 'BossGate KickClientsWithoutMod=true: client plugin requirement on modded server is explicit in CFG.'
  - EpicLoot/StarLevelSystem/MonsterLabZ/OreMines/Basements introduce synchronized game data; inspect documentation and test
    on dedicated server.
  - ExtraSlots/AutomaticFuel/Spearfishing can have optional server installs depending on synchronization and gameplay goals;
    confirm exact build.
  - Jotunn and Newtonsoft/YamlDotNet detectors are dependencies; do not deploy blindly to servers independent of requiring
    mods.
  - Do not confuse presence of DLL in user client directory with server requirement.
