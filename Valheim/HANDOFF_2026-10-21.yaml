specific_conflicts_and_checks:
- id: KEY-F10
  severity: observed_static_conflict
  mods:
  - AutomaticFuel
  - PlantEasily
  evidence: LOCAL AutomaticFuel Mod ToggleKey=F10, PlantEasily EnableSnappingKey=F10; Git AutomaticFuel key is blank.
  recommendation: Choose alternate key or blank for AutomaticFuel after user approval.
- id: SLS-RAID-CUSTOM
  severity: resolved_in_list
  mods:
  - StarLevelSystem
  - Custom Raids
  evidence: Custom Raids DLL absent in latest client ls. Configs archived in Git. SLS EnableCustomRaidsCompat=true has no
    effect without CustomRaids DLL.
  recommendation: Do not reinstall CustomRaids DLL. Dedicated server must also be checked.
- id: SLS-MONSTERLABZ
  severity: runtime_unverified
  mods:
  - StarLevelSystem
  - MonsterLabZ
  evidence: MonsterLabZ spawn chances reduced, SLS global SpawnRateModifier=1.1.
  recommendation: Measure actual spawns; consider SLS 1.0 only after explicit user approval.
- id: SLS-EPICLOOT
  severity: runtime_unverified
  mods:
  - StarLevelSystem
  - EpicLoot
  evidence: SLS loot quantity scaling and EpicLoot independent magic tables.
  recommendation: Test drops from 0-star/1-star/2-star creatures and boss rewards; watch both logs.
- id: SLS-BETTERTAMES
  severity: runtime_unverified
  mods:
  - StarLevelSystem
  - BetterTames
  evidence: Both influence creature star levels; BetterTames awards stars to tames.
  recommendation: Test star gains, level scaling, and protection on a disposable test tame.
- id: PORTAL-GATE
  severity: runtime_unverified
  mods:
  - BossGate
  - XPortal
  - BetterTames
  evidence: BossGate enforces boss-gated portal items, XPortal changes destinations, BetterTames follows through portals.
  recommendation: Test metals before and after biome boss, then test following tame through portal.
- id: KEY-ALT
  severity: likely_context_separated
  mods:
  - DigDug
  - HoeRadius
  - QuickStackStore
  - BetterTames
  evidence: DigDug MenuKey=LeftAlt; HoeRadius scroll modifier=LeftAlt; QuickStack favorite toggle uses Alt; tames use Alt+E/F/G/H.
  recommendation: Test interactions with pickaxe/hoe/container, especially while holding Alt.
- id: KEY-FIGHT
  severity: input_overlap_possible
  mods:
  - EpicLoot
  - BetterTames
  evidence: EpicLoot ability keys g,h,j; BetterTames Alt+G and Alt+H.
  recommendation: Check Alt+G and Alt+H do not trigger unmodified G/H abilities.
- id: SLS-WORLD-RESET
  severity: mitigated
  mods:
  - StarLevelSystem
  - OreMines
  - Basements
  - DigDug
  evidence: SLS EnableLocationReset=false; OreMines own mine reset enabled at 30 days.
  recommendation: Preserve SLS world-reset OFF until tested on isolated backup.
- id: EPICLOOT-PATCH
  severity: unverified_runtime
  mods:
  - EpicLoot
  evidence: JSON patch decreases tool weights at Tiers 0,1,2,3,6.
  recommendation: Check BepInEx log confirms patch applied; base loottables is locally different, audit version.
- id: STACKED-BENEFITS
  severity: design_choice
  mods:
  - AzuCraftyBoxes
  - QuickStackStore
  - AutomaticFuel
  - BetterTames
  evidence: 'Chest radii are separate: 50m,40m,15m,10m.'
  recommendation: Do not force all to one number; they implement different actions.
- id: WORLD-CONTENT
  severity: save_compatibility_warning
  mods:
  - MonsterLabZ
  - OreMines
  - OdinCampsite
  - Basements
  evidence: New prefabs/structures potentially persist in world save.
  recommendation: Save backup before server migration or mod removal.
