# VSP Gamer / VSP Sleep — перенос контекста в отдельный чат ChatGPT.
# Проектное ТЗ, НЕ установленный мод. Дата снимка: 2026-10-27.
handoff:
  schema: "vsp-gamer/mod-development-handoff/v1"
  date: "2026-10-27"
  language: "ru-RU"
  project: "VSP Sleep"
  chat_purpose: "Разработка отдельного BepInEx-мода сна с выбором времени в Valheim"
  github:
    repository: "ValentS1997/vsp-gamer-mods"
    branch: "main"
    directory: "Valheim/Разработка модов/VSP-Sleep/"
    readme: "Valheim/Разработка модов/VSP-Sleep/README.md"
    handoff: "Valheim/Разработка модов/VSP-Sleep/HANDOFF_VSP_SLEEP_2026-10-27.yaml"

  environment:
    game: "Valheim"
    platform: "Linux / Steam"
    mod_loader: "BepInEx 5"
    libraries_present: ["Jotunn.dll"]
    multiplayer: "P2P, vsp-pc выступает хостом; обычно 3 человека"
    relevant_mods: ["StarLevelSystem", "EpicLoot", "AICompanion", "MonsterLabZ"]
    note: "Наличие DLL в снимке не доказывает успешную загрузку в текущем запуске"

  user_goal:
    inspiration: "Сон как в S.T.A.L.K.E.R.: лечь в удобное время и выбрать продолжительность"
    vanilla_bed: true
    no_new_prefabs: true
    possible_time_options_hours: [2, 4, 6, 8]
    status: "Концепция согласована в обсуждении; детали UX ещё не утверждены"

  proposed_functionality:
    interaction:
      trigger: "Shift+E у обычной кровати (предложение, не реализовано)"
      menu: "Показать игровое время и время пробуждения; выбрать часы сна"
      cosmetics: "Анимация сна и затемнение экрана по возможности"
    multiplayer:
      installation: "Предварительно: DLL всем участникам для меню и RPC"
      time_authority: "Единственное изменение времени выполняет хост"
      consent: "Перед перемоткой подтверждение всех подключённых игроков"
      cancel: "Отказ, таймаут или отключение участника отменяет запрос"
      no_forced_skip: true
    gameplay_safety:
      - "Запрещать начало сна при бое и активном рейде"
      - "Не вмешиваться в ванильные постройки и объекты"
      - "Проверять влияние скачка времени на рост, печи, ферментеры и таймеры модов"
      - "Не обещать симуляцию пропущенных часов: сдвиг часов и симуляция различаются"
      - "Не допускать рассинхронизации времени между клиентами"

  implementation_plan:
    - phase: 1
      name: "Техническая проверка"
      tasks:
        - "Изучить доступные API времени и ванильную механику сна для используемой версии игры"
        - "Определить безопасный способ перемотки в P2P; проверить хост/клиент"
        - "Проверить патчи других модов на сон и игровое время"
    - phase: 2
      name: "Минимальный прототип"
      tasks:
        - "Временная тестовая команда у хоста: сдвиг на заданное количество игровых часов"
        - "Логирование; запрет повторных и одновременных запросов"
        - "Только копия мира TESTHEIM"
    - phase: 3
      name: "Кровать и интерфейс"
      tasks:
        - "Перехват взаимодействия с обычной кроватью через Harmony"
        - "Меню 2/4/6/8 ч и расчёт времени пробуждения"
    - phase: 4
      name: "Сетевая сессия"
      tasks:
        - "Запрос согласия участников, таймаут, отказ и отмена"
        - "Хостовая авторизация; защита от повторного RPC"
    - phase: 5
      name: "Тесты и выпуск"
      tasks:
        - "Проверить 1, 2 и 3 игроков; отключения и попытки сна во время боя"
        - "Проверить SLS-рейды, EpicLoot, AICompanion, растения и производство"
        - "Подготовить версионированные DLL/CFG и инструкцию отката только после одобрения"

  open_questions:
    - "Нужно ли требовать нахождения всех игроков в кроватях или достаточно голосования?"
    - "Разрешён ли сон без укрытия/костра, либо соблюдаем ванильные ограничения?"
    - "Нужен ли выбор произвольного времени помимо 2/4/6/8 часов?"
    - "Что делать при подключении нового игрока во время голосования?"
    - "Как именно Valheim синхронизирует ночь/день при ускоренном сне и скачке времени?"
    - "Поведение модовых таймеров требует практического исследования, не предполагается заранее"

  constraints:
    source_of_truth: "Текущая версия игры и код/документация, проверенные перед реализацией"
    changes_require_explicit_approval: true
    do_not_change:
      - "Основные игровые конфиги в Valheim/config/"
      - "Сохранения мира и персонажей"
      - "Существующий набор плагинов друзей"
      - "Основную сборку vsp-pc до успешных тестов"
    rollback_first: "Перед экспериментами создать копию мировых .db и .fwl и отдельный тестовый мир"
    no_force_push: true

  state:
    development: "NOT_STARTED"
    dll_created: false
    deployed: false
    test_results: "Нет"
    github_materials: "Только документация и этот handoff"
    related_mods_reviewed: ["SleepThroughDay", "BedRules", "Wakeup Timer"]
    third_party_code_use: "Не копировать сторонние бинарники; проверить лицензии и API перед использованием"

  next_chat_instruction: |
    Продолжить проект VSP Sleep с технического исследования текущей версии
    Valheim, BepInEx и возможностей безопасной сетевой перемотки времени.
    Сначала сформировать проектную архитектуру, план тестов и ограничения.
    Не утверждать, что мод уже создан, и не изменять игровые файлы
    или Git без отдельного прямого поручения.
