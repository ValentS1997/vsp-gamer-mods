## VSP Gamer / friends-only PlantEasily 2.3.0 client preset
## Purpose: ONLY mass harvesting with ordinary E (no Shift); nearby all eligible resources, radius 3 m.
## In the PlantEasily source Player.Interact checks ZInput.GetKey(KeyboardHarvestModifierKey).
## E is both the vanilla interaction key and the chosen harvest modifier.
## Other features disabled as far as available settings allow. ModActive must remain true.
## Do not mix PlantEasily and MassFarming on one client; do not overwrite host's full config.

[Controls]
EnableModKey = None
EnableSnappingKey = None
ToggleAutoReplantKey = None
IncreaseXKey = None
IncreaseYKey = None
DecreaseXKey = None
DecreaseYKey = None
KeyboardModifierKey = None
GamepadModifierKey = None
KeyboardHarvestModifierKey = E

[General]
ModActive = true
SnapActive = false
Rows = 1
Columns = 1
RandomizeRotation = false
EnableScatter = false
PositionScatterRadius = 0
RotationScatterAngle = 0
EnableDebugMessages = false

[Difficulty]
PreventPartialPlanting = false
PreventInvalidPlanting = false
UseStamina = true
UseDurability = true

[Grid]
GloballyAlignGridDirections = false
MinimizeGridSpacing = false
ForceAltPlacement = false
PreferCardinalSnapping = false
ExtraCropSpacing = 0
ExtraSaplingSpacing = 0

[Harvesting]
EnableBulkHarvest = true
HarvestStyle = AllResources
HarvestRadius = 3
ReplantOnHarvest = false

[Performance]
MaxConcurrentPlacements = 2
GhostUpdateBatchSize = 1
BulkPlantingBatchSize = 2

[Pickables]
PreventOverlappingPlacements = false

[UI]
ShowCost = false
ShowHUDKeyHints = false
ShowHoverKeyHints = false
ShowHoverReplantHint = false
ShowGhostsDuringPlacement = false
ShowGridDirections = false
ShowSnapDirection = false
HighlightRootGhost = false
