[3 - Progression]

## SERVER SETTING. If true, a boss can only be summoned after ALL the bosses before it in the progression order (Eikthyr, The Elder, Bonemass, Moder, Yagluth, The Queen, Fader, Kall Fimbulbringer) have been defeated in the world. Works together with the unlock days: the boss must be unlocked by the day AND the previous bosses must be dead. Eikthyr is never affected.
# Setting type: Boolean
# Default value: false
RequirePreviousBossDefeated = false

## SERVER SETTING. Decides whose boss kills count for RequirePreviousBossDefeated and PortalItemsRequireBossKill. false = world progress: a boss killed by anyone counts for every player. true = personal progress: each player only counts the bosses (and Hildir minibosses) they took part in killing in THIS world (hit it, or were within 40 m when it died). Kills made in other worlds never count. Kills are recorded even while this is false, as long as the players run BossGate 1.1.1 or newer.
# Setting type: Boolean
# Default value: false
PerPlayerProgress = false

[4 - Portals]

## SERVER SETTING. false = vanilla: ores and metals that the game blocks can never go through portals. true = the blocked items of a biome can go through portals only after the boss of that biome has been defeated in the world (Black Forest ores: The Elder, iron: Bonemass, silver and dragon eggs: Moder, black metal: Yagluth, Mistlands items: The Queen, flametal: Fader, gold: Kall Fimbulbringer). Hildir's chests: the miniboss that guards the chest AND the boss of its biome (Brass: Brenna + The Elder, Silver: Geirrhafa + Moder, Bronze: Zil & Thungr + Yagluth). Items of a biome whose boss is still alive stay blocked.
# Setting type: Boolean
# Default value: false
PortalItemsRequireBossKill = true

